name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check the tag matches the manifest version
        run: |
          node -e "
          const m = require('./manifest.json');
          const tag = process.env.GITHUB_REF_NAME;
          if (m.version !== tag) {
            const hint = tag === 'v' + m.version ? ' (drop the leading v: Obsidian matches the release tag to the manifest version exactly)' : '';
            console.error('tag ' + tag + ' does not match manifest ' + m.version + hint);
            process.exit(1);
          }
          "

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            main.js
            manifest.json
