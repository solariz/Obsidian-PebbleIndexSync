name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check the tag matches the manifest version
        run: |
          node -e "const m = require('./manifest.json'); const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (m.version !== tag) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match manifest ' + m.version); process.exit(1); }"

      - name: Package the plugin files
        run: |
          mkdir -p pebble-index-sync
          cp main.js manifest.json pebble-index-sync/
          zip -r pebble-index-sync.zip pebble-index-sync

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            main.js
            manifest.json
            pebble-index-sync.zip
